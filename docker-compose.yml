# 後端設定
x-backend: &backend-common
  build:
    context: ./backend
  env_file:
    - path: ./backend/.env
      required: false
  restart: unless-stopped

services:
  api:
    <<: *backend-common
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    ports:
      - "8081:8000"
    volumes:
      - ./frontend:/frontend
      - ./log:/app/log
    environment:
      PDF_COMPARE_FRONTEND_DIR: /frontend
      PDF_COMPARE_LOG_DIR: /app/log
      PDF_COMPARE_LOG_RETENTION_DAYS: 14
      PDF_COMPARE_LLM_BASE_URL: ${PDF_COMPARE_LLM_BASE_URL:-http://192.168.39.143:8005}
      PDF_COMPARE_LLM_MODEL: ${PDF_COMPARE_LLM_MODEL:-Qwen/Qwen3.8-27B}
